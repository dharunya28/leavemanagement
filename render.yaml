services:
  - type: web
    name: student-leave-management
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_NAME
        sync: false
      - key: STAFF_EMAIL
        sync: false
      - key: STAFF_PASSWORD
        sync: false
